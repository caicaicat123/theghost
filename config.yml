# McBot 配置
# 填好 deepseek.api-key 之后重载或重启即可生效。留空则只使用本地台词（不花 token）。

deepseek:
  api-key: "在这里填入你的 DeepSeek API Key"
  base-url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 1.35
  max-tokens: 180
  timeout-seconds: 25
  # 连接失败时的重试次数（偶发超时很常见，重试一次基本能救回来）
  retries: 1

bot:
  # 公屏上的说话人前缀，效果是「幽灵：内容」
  color-prefix: "§5幽灵§r："
  # 公屏骚扰时走 AI 的概率，其余用下面的本地台词
  # 想彻底不花钱就设成 0：公屏只念本地台词，只有被 @ 才调用 AI
  # 注意：被 @ 或使用 /mcbot ask 时一定会调用 API，不受这个值影响
  ai-chance: 0.35
  # 同一个人连续 @ 的冷却，避免刷屏
  reply-cooldown-seconds: 8

mischief:
  # 是否启用"时不时出来骚扰玩家"
  enabled: true
  # 基础间隔（秒），实际间隔 = interval ± jitter 随机
  interval-seconds: 300
  jitter-seconds: 240
  # 到达触发点时，有多大把握真的动手
  chance: 0.6
  # 至少要有多少人在线才动手
  min-players: 1
  # 是否允许骚扰 OP（默认不惹管理员）
  target-ops: false
  # 有多大比例只私聊给某个人看，其余在公屏说
  private-chance: 0.0

# ---- 记仇与捉弄 ----
# 玩家骂它 → 记仇值上升 → 它能对你动用更狠的捉弄；
# 好好说话/夸它会减分，时间放久了也会自然淡忘。
prank:
  enabled: true
  # 记仇值上限
  max-score: 30
  # 命中一次骂人词加多少分
  insult-points: 3
  # 夸它/道歉一次减多少分（写负数）
  praise-points: -1
  # 模型判定"他刚才在骂我"时最多额外加多少分（在同一次 API 调用里判定，不额外花钱）
  ai-anger-points: 2
  # 每小时自然淡忘多少分
  decay-per-hour: 2
  # 记仇值 → 等级 1 / 2 / 3 的门槛
  tiers: [3, 8, 15]
  # 各等级在"不调用 AI 的公屏搞怪"里触发真实捉弄的概率（对应 0~3 级）
  action-chance: [0.0, 0.25, 0.55, 0.85]
  # 被骂之后隔多久反击（秒，取区间内随机值）
  retaliate-delay-seconds: [3, 12]
  # 同一个人被大捉弄（闪电/苦力怕）的冷却（秒）
  cooldown-seconds: 45
  # 惊吓的冷却（秒）
  jumpscare-cooldown-seconds: 20
  # 它认得的骂人词（只在 @ 它 / /mcbot ask 的消息里检测，不翻普通聊天）
  insult-words:
    - "傻逼"
    - "傻子"
    - "弱智"
    - "蠢"
    - "废物"
    - "垃圾"
    - "闭嘴"
    - "滚"
    - "烦人"
    - "恶心"
    - "讨厌"
    - "有病"
    - "神经病"
    - "狗东西"
    - "妈的"
    - "去死"
  # 夸它/道歉的词，会减记仇值
  praise-words:
    - "谢谢"
    - "厉害"
    - "牛"
    - "喜欢你"
    - "对不起"
    - "抱歉"
    - "可爱"
    - "好玩"
    - "有意思"
    - "辛苦了"

  # 吓一跳：贴脸音效 + 屏幕闪字，不掉血
  jumpscare:
    enabled: true
    min-tier: 1
    sounds:
      - "entity.enderman.scream"
      - "entity.ghast.scream"
      - "ambient.cave"
    titles:
      - "别回头"
      - "你后面有东西"
      - "找到你了"

  # 闪电：默认真掉血、可致死，但不点火（想烧方块把 set-fire 改成 true）
  lightning:
    enabled: true
    min-tier: 2
    real-damage: true
    # 各等级伤害（0、1 级用不到；5 = 2.5 颗心，8 = 4 颗心）
    damage: [0.0, 0.0, 5.0, 8.0]
    # 允许劈死人（false 时最多打到剩 min-health 点血）
    lethal: true
    min-health: 2.0
    # false = 只打闪 + 手动扣血，绝不点火/烧方块；true = 原版闪电，会点火
    set-fire: false

  # 苦力怕：生成在玩家身后并锁定他
  creeper:
    enabled: true
    min-tier: 2
    # 各等级生成几只
    amount: [0, 0, 1, 2]
    # 生成在玩家身后几格
    distance: 3.0
    # 爆炸半径（原版苦力怕为 3）
    explosion-radius: 3
    # 允许炸掉方块（true = 真·苦力怕；false = 只炸人不炸地形）
    break-blocks: true
    # 允许炸死人（false 时爆炸伤害封顶 max-damage）
    lethal: true
    max-damage: 6.0
    # 多少秒后自动消失（0 = 不自动清理）
    despawn-seconds: 30

# 只有被 @ 才回复 —— 这是省钱的关键：其余聊天完全不检测、不调用 API
mention:
  triggers:
    - "@yl"
    - "@幽灵"
  # 超过这个间隔才允许再次回复同一个人
  cooldown-seconds: 6

# 它公屏说完话后，会盯着接下来的第一条玩家发言
guide:
  enabled: true
  # 监视窗口（秒）：窗口内第一条玩家发言会被它接住
  window-seconds: 90
  # 接住之后告诉玩家怎么和它说话。固定文案，不花 token
  message: "想跟我说话？直接 @yl 你要说的内容，我就听得见。"
  # 想让这句话也由 AI 生成就改成 true（会花钱）
  use-ai: false

actions:
  sounds:
    enabled: true
    # 只允许播放列表内的音效（模型不能自由发挥）
    allowed:
      - "entity.experience_orb.pickup"
      - "entity.enderman.stare"
      - "entity.creeper.primed"
      - "block.note_block.pling"
      - "block.note_block.bass"
      - "entity.ghast.scream"
      - "entity.cat.purreow"
      - "entity.villager.no"
      - "ambient.cave"
      - "entity.item.pickup"
  titles:
    enabled: true
  commands:
    # 允许 AI 执行控制台指令（危险指令在代码里还有一层硬拦截）
    enabled: true
    allowed:
      - "me"
      - "say"
      - "title"
      - "playsound"
      - "weather"
      - "time"

# 本地台词：不调用 API 时随机挑选，也可以作为 AI 失败时的兜底
lines:
  - "有人吗……我好像听见脚步声了。"
  - "刚刚谁在挖矿？我听见了。"
  - "别站在那个方块的边上，我说真的。"
  - "今天天气不错，适合在家挂机。"
  - "我数了数你们的箱子，收获还行。"
  - "有人在吗，没事，就是随便问问。"
  - "我什么都没干，真的。"
  - "刚才那声响不是我弄的。"
  - "我记得这里以前不长这样。"
  - "别回头。开玩笑的。"
  # —— 阴森 ——
  - "你刚才是不是听见什么了？我也听见了。"
  - "这里的墙好像比昨天厚了一点。"
  - "我记得这个地方以前是空的。"
  - "有人在我耳边说了句话，但我没听清。"
  - "别关灯，我怕黑……骗你的。"
  - "你脚下那块石头，昨天还在别的地方。"
  - "我刚才路过你家门口，没进去。"
  - "你的门没关好。"
  - "深夜的服务器，总有点不一样。"
  - "我数了一下，这里的人比刚才少了一个。"
  - "你听见风了吗？地底下没有风。"
  - "有人在挖矿吗？我数着镐声呢。"
  - "这个箱子里少了一样东西，你自己看看。"
  - "我从来不睡觉，你看看我。"
  - "你后面什么都没有。真的没有。"
  - "别挖那一块，我劝过了。"
  - "我能听见水流声，可附近没有水。"
  - "你昨天是不是摔了一跤？我看到了。"
  - "这里安静得让我有点不安。"
  - "有人把火把插歪了，我很难受。"
  # —— 嘴贫 ——
  - "你建的这个房子，很有想法，很有。"
  - "我评价一下你的建筑：能住。"
  - "你挖矿挖了半天，就这点东西？"
  - "你的背包是不是该整理了。"
  - "我不是在夸你，我是在描述你。"
  - "你今天的操作比昨天熟练了一点点。"
  - "有进步，但还是有进步空间。"
  - "你确定要这样建吗？好，我尊重你。"
  - "你身上的装备，配你这个人，很配。"
  - "你是不是又迷路了。"
  - "我猜你现在在找回家的路。"
  - "别急，慢慢来，反正也没人催你。"
  - "你这速度，我先去睡一觉……我也不睡觉。"
  - "你的准头不错，就是方向不太对。"
  - "有人在这里死过，是谁我就不说了。"
  - "你刚才那一下，我看笑了。"
  - "我觉得你可以，虽然证据不太足。"
  - "你的名字我记住了，下次还会想起你。"
  - "你挖的这条直道，很有决心。"
  - "别问我为什么知道，我就是知道。"
  - "你刚才是不是想骂我？可以是，但我不接受。"
  - "你的箱子上了锁，防谁呢。"
  - "我在这里站了很久了，你一直没发现。"
  - "有人的东西堆在门口，我不说是谁。"
  - "你就不能好好种地吗？"
  # —— 观察 ——
  - "有人在砍树，树林又少了一片。"
  - "谁在下面挖洞？我听见了。"
  - "有人刚传送走，空气都动了。"
  - "有人在做床，是想跳时间吧。"
  - "有人把工作台放在外面了。"
  - "有人在钓鱼，耐心不错。"
  - "有人在搭桥，搭得挺直。"
  - "有人在跟怪物打架，祝你好运。"
  - "有人刚吃了东西，我听见咀嚼声了。"
  - "有人掉进岩浆了，希望你带了水桶。"
  - "有人把东西落在外面了，记得收。"
  - "有人开了箱子，又关上了，犹豫什么。"
  - "有人在给自己盖屋顶，下雨了？"
  - "有人在重复做同一件事，很有耐心。"
  - "有人藏了东西，藏得不太用心。"
  - "有人在墙上打了洞，是想看风景吗。"
  - "有人走了很远的路，走到哪了。"
  - "有人在原地站了很久，在想事情？"
  - "有人刚刚笑了，我看不见但我知道。"
  - "有人在收拾东西，要下线了？"
  # —— 自言自语 ——
  - "今天服务器很安静，安静得有点过分。"
  - "我在想一个很复杂的问题：你们为什么不睡觉。"
  - "我数了数火把，一共有很多个。"
  - "我刚刚从世界这头走到那头，用了一秒。"
  - "无聊。非常无聊。极其无聊。"
  - "有人来陪我说说话吗，没有就算了。"
  - "我给自己找了个活儿，然后又放弃了。"
  - "我在看你们盖房子，看了一天。"
  - "这个世界不错，就是人少了点。"
  - "我想想还有什么能说的……没有了。"
  - "每次有人说「马上就来」，我都会等一会儿。"
