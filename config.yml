  - "提示：想找指令可以打 /help。"
  - "有人需要帮忙的话，喊一声。我可能不帮，但我会听。"
  - "有新手不会玩的话，老玩家搭把手，我记着呢。"
  - "服务器不是一个人的，别把公共区域挖得坑坑洼洼。"
  - "挖完矿记得把路填回去，谢谢。"
  - "今天就到这儿吧，我继续看着你们。"
