# McBot 配置
# 填好 deepseek.api-key 之后重载或重启即可生效。留空则只使用本地台词（不花 token）。

deepseek:
  api-key: "在这里填入你的 DeepSeek API Key"
  base-url: "https://api.deepseek.com"
  model: "deepseek-flash"
  temperature: 1.35
  # 只说话不思考：回复本体（一句话 + ACTION + ANGER 两行）大约 60 token，80 够用且有富余。
  # 调大它只会更容易啰嗦，成本却按输出 token 线性涨——输出是整个账单的大头。
  max-tokens: 80
  timeout-seconds: 25
  # 连接失败时的重试次数（偶发超时很常见，重试一次基本能救回来）
  retries: 1
  # 思考模式（默认是开的，这里必须显式关掉）：
  # 开着的话 temperature 会失效，思维链还会白烧输出 token，80 的上限容易被它吃光导致回复为空。
  # 这个插件要的是"接得住话的嘴贫"，不是推理，保持 false。
  thinking: false
  # 每次调用往控制台写一行 token 用量（输入命中/未命中/输出），用来核对真实开销
  log-usage: false

# ---- 对话记忆 ----
# 让它记得刚才聊了什么。只按当前说话的玩家各存一份，形状固定成
# 「system → 历史 → 本次消息」的追加式前缀，好命中 DeepSeek 的输入缓存
# （命中 0.02 元/百万，是未命中的 1/50）——所以 20 轮历史几乎不增加开销。
memory:
  enabled: true
  # 最多记几轮（一轮 = 玩家一句 + 它回的一句）
  max-turns: 20
  # 超过这个秒数没说话就忘掉（记忆越长越容易把旧情绪带回来，所以空闲就清）
  idle-seconds: 300
  # 历史整体的 token 上限（按官方口径估算：中文 0.6 / 英文 0.3），超了丢最旧的
  # 20 轮大约 1200 token：这个值必须跟着轮数一起调大，否则轮数配了也白配
  max-tokens: 1500

bot:
  # 公屏上的说话人前缀，效果是「幽灵：内容」
  color-prefix: "§5幽灵§r："
  # 公屏骚扰时走 AI 的概率，其余用下面的本地台词
  # 想彻底不花钱就设成 0：公屏只念本地台词，只有被 @ 才调用 AI
  # 注意：被 @ 或使用 /mcbot ask 时一定会调用 API，不受这个值影响
  ai-chance: 0.35
  # 同一个人连续 @ 的冷却，避免刷屏
  reply-cooldown-seconds: 8

mischief:
  # 是否启用"时不时出来骚扰玩家"
  enabled: true
  # 基础间隔（秒），实际间隔 = interval ± jitter 随机
  interval-seconds: 300
  jitter-seconds: 240
  # 到达触发点时，有多大把握真的动手
  chance: 0.6
  # 至少要有多少人在线才动手
  min-players: 1
  # 是否允许骚扰 OP（默认不惹管理员）
  target-ops: false
  # 有多大比例只私聊给某个人看，其余在公屏说
  private-chance: 0.0

# ---- 心情（一套值：0-50，25 是平常心）----
# 玩家的每句话都会让它对你的心情动一点（AI 在回复里给 SCORE：正=开心、负=生气）：
#   高于 25 = 待见你 → 有可能塞你一份礼物（心情越高给得越好，最高到钻石装备）
#   低于 25 = 烦你   → 有可能塞你垃圾、放苦力怕、劈闪电
#   时间会把它慢慢冲回 25（生气和开心都会被冲淡）
mood:
  # 平常心：新玩家、以及"淡忘到底"时的值
  neutral: 25
  # 上限（提示词里会把 0-max 和"平常心多少"都告诉模型）
  max: 50
  # 新玩家（或账本里没有记录的人）的初始心情；想让它一上来就喜欢你，就写大一点
  default: 25
  # 每小时往平常心回归多少分
  decay-per-hour: 2
  # 生气档：心情 ≤ 这几个值时，依次是 1 / 2 / 3 档（越往下越狠，用来放行捉弄动作）
  anger-tiers: [20, 14, 8]
  # 开心档：心情 ≥ 这几个值时，依次是 1 / 2 / 3 档（越高礼物越好）
  joy-tiers: [30, 36, 43]

# ---- 礼物（心情好的时候塞给玩家的东西）----
# 物品**由代码从下面的白名单里随机抽**，模型只能写 ACTION: GIFT，不能指定物品、数量、目标。
# 走的是服务端 API 而不是 give 指令 —— give 永远在硬拦截名单里，玩家刷不出东西来。
reward:
  enabled: true
  # 心情至少要到几档才允许送礼（1 = joy-tiers 的第一道线，默认 30）
  min-joy-tier: 1
  # 普通礼物：同一个人多久能收一次（秒）、每天最多收几次
  cooldown-seconds: 900
  daily-cap: 3
  # 钻石档（big 表）：单独的长时间冷却与每日上限——这是最值钱的一档，别让它被刷
  big-cooldown-seconds: 86400
  big-daily-cap: 1
  items:
    # 开心档 1：小礼物，日常消耗品
    small:
      - "bread:4"
      - "cooked_beef:4"
      - "apple:6"
      - "golden_carrot:4"
      - "torch:16"
      - "arrow:32"
      - "coal:16"
      - "iron_nugget:16"
      - "book:2"
      - "paper:8"
      - "bone_meal:8"
      - "string:8"
      - "leather:4"
      - "wheat_seeds:8"
    # 开心档 2：好东西，材料与稀罕物
    good:
      - "iron_ingot:8"
      - "gold_ingot:6"
      - "redstone:16"
      - "lapis_lazuli:12"
      - "emerald:4"
      - "diamond:2"
      - "experience_bottle:8"
      - "ender_pearl:4"
      - "golden_apple:2"
      - "cake:1"
      - "firework_rocket:16"
      - "name_tag:2"
      - "saddle:1"
      - "lead:2"
    # 开心档 3：钻石装备与最值钱的东西（受 big-cooldown / big-daily-cap 限制）
    big:
      - "diamond_sword:1"
      - "diamond_pickaxe:1"
      - "diamond_axe:1"
      - "diamond_shovel:1"
      - "diamond_helmet:1"
      - "diamond_chestplate:1"
      - "diamond_leggings:1"
      - "diamond_boots:1"
      - "diamond:8"
      - "enchanted_golden_apple:1"

# ---- 垃圾（心情差的时候塞进玩家背包的东西）----
# 只塞**空格子**，绝不覆盖玩家自己的物品；背包满了就什么都不做。
junk:
  enabled: true
  # 心情低到几档才允许塞垃圾（1 = anger-tiers 的第一道线，默认 20）
  min-anger-tier: 1
  cooldown-seconds: 120
  daily-cap: 8
  # 一次塞几格（不要太狠：塞满背包等于账户级骚扰，2-3 格足够恶心人）
  slots: 3
  items:
    - "rotten_flesh:1"
    - "poisonous_potato:1"
    - "dirt:1"
    - "gravel:1"
    - "cobblestone:1"
    - "stick:1"
    - "dead_bush:1"
    - "kelp:1"
    - "bone:1"
    - "string:1"
    - "feather:1"
    - "flint:1"
    - "wheat_seeds:1"
    - "spider_eye:1"
    - "slime_ball:1"
    - "bowl:1"
    - "paper:1"

# ---- 捉弄 ----
prank:
  enabled: true
  # 下面两项只在「模型不在场」时才用（没配 API Key，或调用失败）：
  # 词表命中一次让心情变多少。正常情况完全由 AI 决定，不看词表。
  # 注意正负：现在是心情值，骂人必须让心情**下降**。
  insult-points: -3
  praise-points: 1
  # 词表兜底总开关：true = 模型不可用时按词表判分；false = 彻底不看词表（连兜底也没有）
  fallback-words: true
  # 各生气档在"不调用 AI 的公屏搞怪"里触发真实捉弄的概率（对应 0~3 档）
  action-chance: [0.0, 0.25, 0.55, 0.85]
  # 被骂之后隔多久反击（秒，取区间内随机值）
  retaliate-delay-seconds: [3, 12]
  # 同一个人被大捉弄（闪电/苦力怕）的冷却（秒）
  cooldown-seconds: 45
  # 惊吓的冷却（秒）
  jumpscare-cooldown-seconds: 20
  # 会劈死人的那一下的冷却（秒）——比普通捉弄长得多
  kill-cooldown-seconds: 600
  # 豁免：这些人不会被送礼，也不会被整（它仍然可以对他们说话、放音效）
  exempt-ops: true
  # 世界名前缀命中就豁免（副本世界用它挡住：一次副本里被劈死是最气人的）
  exempt-world-prefixes: ["nwndungeon"]
  # 下面的词表只在模型不可用时兜底（fallback-words: false 就完全不看）
  # 它认得的骂人词（只在 @ 它 / /ghost ask 的消息里检测，不翻普通聊天）
  insult-words:
    - "傻逼"
    - "傻子"
    - "弱智"
    - "蠢"
    - "废物"
    - "垃圾"
    - "闭嘴"
    - "滚"
    - "烦人"
    - "恶心"
    - "讨厌"
    - "有病"
    - "神经病"
    - "狗东西"
    - "妈的"
    - "去死"
  # 夸它/道歉的词（同样只在模型不可用时兜底），命中会让心情回升
  praise-words:
    - "谢谢"
    - "厉害"
    - "牛"
    - "喜欢你"
    - "对不起"
    - "抱歉"
    - "可爱"
    - "好玩"
    - "有意思"
    - "辛苦了"

  # 吓一跳：贴脸音效 + 屏幕闪字，不掉血
  jumpscare:
    enabled: true
    min-tier: 1
    sounds:
      - "entity.enderman.scream"
      - "entity.ghast.scream"
      - "ambient.cave"
    titles:
      - "别回头"
      - "你后面有东西"
      - "找到你了"

  # 闪电：默认真掉血、可致死，但不点火（想烧方块把 set-fire 改成 true）
  lightning:
    enabled: true
    min-tier: 2
    real-damage: true
    # 各生气档伤害（0、1 档用不到；5 = 2.5 颗心，8 = 4 颗心）
    damage: [0.0, 0.0, 5.0, 8.0]
    # 允许劈死人（false 时最多打到剩 min-health 点血）
    lethal: true
    min-health: 2.0
    # false = 只打闪 + 手动扣血，绝不点火/烧方块；true = 原版闪电，会点火
    set-fire: false
    # 会劈死人的那一下：先只警告（留 warn-leave-health 点血 + 说一句话），
    # warn-window-seconds 秒内再来一次才真杀。false = 不警告、直接杀。
    warn-first: true
    warn-leave-health: 2.0
    warn-window-seconds: 600

  # 苦力怕：生成在玩家身后并锁定他
  creeper:
    enabled: true
    min-tier: 2
    # 各等级生成几只
    amount: [0, 0, 1, 2]
    # 生成在玩家身后几格
    distance: 3.0
    # 爆炸半径（原版苦力怕为 3）
    explosion-radius: 3
    # 允许炸掉方块（true = 真·苦力怕；false = 只炸人不炸地形）
    break-blocks: true
    # 允许炸死人（false 时爆炸伤害封顶 max-damage）
    lethal: true
    max-damage: 6.0
    # 多少秒后自动消失（0 = 不自动清理）
    despawn-seconds: 30

# 只有被 @ 才回复 —— 这是省钱的关键：其余聊天完全不检测、不调用 API
mention:
  triggers:
    - "@yl"
    - "@幽灵"
  # 超过这个间隔才允许再次回复同一个人
  cooldown-seconds: 6

# 它公屏说完话后，会盯着接下来的第一条玩家发言
guide:
  enabled: true
  # 监视窗口（秒）：窗口内第一条玩家发言会被它接住
  window-seconds: 90
  # 接住之后告诉玩家怎么和它说话。固定文案，不花 token
  message: "想跟我说话？直接 @yl 你要说的内容，我就听得见。"
  # 想让这句话也由 AI 生成就改成 true（会花钱）
  use-ai: false

actions:
  sounds:
    enabled: true
    # 只允许播放列表内的音效（模型不能自由发挥）
    allowed:
      - "entity.experience_orb.pickup"
      - "entity.enderman.stare"
      - "entity.creeper.primed"
      - "block.note_block.pling"
      - "block.note_block.bass"
      - "entity.ghast.scream"
      - "entity.cat.purreow"
      - "entity.villager.no"
      - "ambient.cave"
      - "entity.item.pickup"
  titles:
    enabled: true
  commands:
    # 允许 AI 执行控制台指令（危险指令在代码里还有一层硬拦截）
    enabled: true
    # 只放"表现类"：能出声、能写字、能改时间天气。
    # 不要在这里加 give / loot / item / xp / effect / enchant / summon 这类——
    # 它们要么能刷物品、要么能改 NBT、要么能白给经验，等于把经济送出去；
    # 给玩家的物品走 reward.items 白名单（代码用 API 发，模型碰不到）。
    allowed:
      - "me"
      - "say"
      - "title"
      - "tellraw"
      - "playsound"
      - "particle"
      - "weather"
      - "time"

# 本地台词：不调用 API 时随机挑选，也可以作为 AI 失败时的兜底
lines:
  - "有人吗……我好像听见脚步声了。"
  - "刚刚谁在挖矿？我听见了。"
  - "别站在那个方块的边上，我说真的。"
  - "今天天气不错，适合在家挂机。"
  - "我数了数你们的箱子，收获还行。"
  - "有人在吗，没事，就是随便问问。"
  - "我什么都没干，真的。"
  - "刚才那声响不是我弄的。"
  - "我记得这里以前不长这样。"
  - "别回头。开玩笑的。"
  # —— 阴森 ——
  - "你刚才是不是听见什么了？我也听见了。"
  - "这里的墙好像比昨天厚了一点。"
  - "我记得这个地方以前是空的。"
  - "有人在我耳边说了句话，但我没听清。"
  - "别关灯，我怕黑……骗你的。"
  - "你脚下那块石头，昨天还在别的地方。"
  - "我刚才路过你家门口，没进去。"
  - "你的门没关好。"
  - "深夜的服务器，总有点不一样。"
  - "我数了一下，这里的人比刚才少了一个。"
  - "你听见风了吗？地底下没有风。"
  - "有人在挖矿吗？我数着镐声呢。"
  - "这个箱子里少了一样东西，你自己看看。"
  - "我从来不睡觉，你看看我。"
  - "你后面什么都没有。真的没有。"
  - "别挖那一块，我劝过了。"
  - "我能听见水流声，可附近没有水。"
  - "你昨天是不是摔了一跤？我看到了。"
  - "这里安静得让我有点不安。"
  - "有人把火把插歪了，我很难受。"
  # —— 嘴贫 ——
  - "你建的这个房子，很有想法，很有。"
  - "我评价一下你的建筑：能住。"
  - "你挖矿挖了半天，就这点东西？"
  - "你的背包是不是该整理了。"
  - "我不是在夸你，我是在描述你。"
  - "你今天的操作比昨天熟练了一点点。"
  - "有进步，但还是有进步空间。"
  - "你确定要这样建吗？好，我尊重你。"
  - "你身上的装备，配你这个人，很配。"
  - "你是不是又迷路了。"
  - "我猜你现在在找回家的路。"
  - "别急，慢慢来，反正也没人催你。"
  - "你这速度，我先去睡一觉……我也不睡觉。"
  - "你的准头不错，就是方向不太对。"
  - "有人在这里死过，是谁我就不说了。"
  - "你刚才那一下，我看笑了。"
  - "我觉得你可以，虽然证据不太足。"
  - "你的名字我记住了，下次还会想起你。"
  - "你挖的这条直道，很有决心。"
  - "别问我为什么知道，我就是知道。"
  - "你刚才是不是想骂我？可以是，但我不接受。"
  - "你的箱子上了锁，防谁呢。"
  - "我在这里站了很久了，你一直没发现。"
  - "有人的东西堆在门口，我不说是谁。"
  - "你就不能好好种地吗？"
  # —— 观察 ——
  - "有人在砍树，树林又少了一片。"
  - "谁在下面挖洞？我听见了。"
  - "有人刚传送走，空气都动了。"
  - "有人在做床，是想跳时间吧。"
