name: McBot
version: 1.4.0
main: mcbot.McBot
api-version: '1.21'
description: 一个住在服务器里的捣蛋鬼 AI：会嘴贫、会记仇、会真的劈你。
author: 新世界网络
commands:
  mcbot:
    description: 和服务器里的 AI 交互，或管理它的行为与记仇账本。
    usage: /mcbot <ask|poke|grudge|prank|reload|toggle|status|test> [内容]
permissions:
  mcbot.admin:
    description: 重载配置、强制触发、暂停搞怪。
    default: op
  mcbot.talk:
    description: 允许向 AI 提问。
    default: true
