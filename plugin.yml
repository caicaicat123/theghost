name: TheGhost
version: 1.6.0
main: mcbot.McBot
api-version: '1.21'
description: 一个住在服务器里的捣蛋鬼 AI「幽灵」：会嘴贫、会记仇、会送你钻石也会塞你一背包垃圾。
author: 新世界网络
commands:
  ghost:
    description: 和服务器里的 AI 交互，或管理它的心情、礼物、捉弄与记忆。
    usage: /ghost <ask|poke|mood|prank|gift|junk|forget|reload|toggle|status|test> [内容]
permissions:
  theghost.admin:
    description: 重载配置、强制触发、暂停搞怪、查看或修改心情、手动捉弄或送礼、清空对话记忆。
    default: op
  theghost.talk:
    description: 允许向 AI 提问。
    default: true
  theghost.immune:
    description: 完全免疫：不会被送礼，也不会被整（仍然可以逗它说话）。
    default: false
